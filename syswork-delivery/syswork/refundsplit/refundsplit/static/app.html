<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>refundsplit — refund allocation</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f6f7f9;
    --card: #ffffff;
    --ink: #16191d;
    --muted: #63696f;
    --line: #e2e5e9;
    --good-bg: #e8f5ec; --good-ink: #17603a; --good-line: #a7d7b9;
    --bad-bg: #fdeceb;  --bad-ink: #9b2019;  --bad-line: #f2b4af;
    --accent: #2f4f7f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171a; --card: #1c2025; --ink: #eceff2; --muted: #9aa3ab; --line: #2c3238;
      --good-bg: #16301f; --good-ink: #7fd3a0; --good-line: #2c5c3d;
      --bad-bg: #331a19; --bad-ink: #f3948c; --bad-line: #65302c;
      --accent: #9ab8e6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 20px 64px;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink);
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-bottom: 18px;
  }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.07em;
       color: var(--muted); margin: 0 0 14px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  input {
    font: inherit; font-variant-numeric: tabular-nums; padding: 7px 10px;
    border: 1px solid var(--line); border-radius: 6px;
    background: var(--bg); color: var(--ink); width: 100%;
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600;
       padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  th.num, td.num { text-align: right; }
  td { padding: 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; }
  td.amount { width: 130px; }
  td.share { font-variant-numeric: tabular-nums; font-weight: 600; width: 120px; }
  .changed { animation: flash 1.1s ease-out; border-radius: 4px; }
  @keyframes flash { from { background: #ffe9a8; } to { background: transparent; } }
  .badge { border-radius: 10px; padding: 20px 22px; border: 1px solid; margin-bottom: 18px; }
  .badge.good { background: var(--good-bg); color: var(--good-ink); border-color: var(--good-line); }
  .badge.bad  { background: var(--bad-bg);  color: var(--bad-ink);  border-color: var(--bad-line); }
  .badge .headline { font-size: 30px; font-weight: 700; font-variant-numeric: tabular-nums;
                     letter-spacing: -0.02em; }
  .badge .detail { font-size: 14px; margin-top: 6px; opacity: 0.92; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > div { flex: 1 1 160px; }
  button {
    font: inherit; font-weight: 500; padding: 8px 14px; border-radius: 6px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:hover { filter: brightness(1.06); }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .order { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
           color: var(--muted); margin-top: 12px; }
  .err { color: var(--bad-ink); font-size: 13px; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>refundsplit</h1>
  <p class="sub">Split a refund across the order lines it applies to. ENG-4172 demo build.</p>

  <div id="badge" class="badge bad">
    <div class="headline">—</div>
    <div class="detail">calculating…</div>
  </div>

  <div class="card">
    <h2>Refund</h2>
    <div class="row">
      <div>
        <label for="total">Refund total</label>
        <input id="total" value="100.00" inputmode="decimal">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Order lines</h2>
    <table>
      <thead>
        <tr><th>Line</th><th class="num">Line total</th><th class="num">Refund share</th></tr>
      </thead>
      <tbody id="lines"></tbody>
    </table>
    <div class="actions">
      <button class="primary" id="recalc">Recalculate</button>
      <button id="shuffle">Shuffle line order</button>
      <button id="reset">Reset</button>
    </div>
    <div class="order" id="order"></div>
    <div class="err" id="err"></div>
  </div>
</main>

<script>
const DEFAULT_LINES = [
  { line_id: "L-001", amount: "10.00" },
  { line_id: "L-002", amount: "10.00" },
  { line_id: "L-003", amount: "10.00" },
];
let lines = DEFAULT_LINES.map(l => ({ ...l }));
let previous = {};

const $ = id => document.getElementById(id);

function renderLines() {
  const byId = [...lines].sort((a, b) => a.line_id.localeCompare(b.line_id));
  $("lines").innerHTML = byId.map(l => `
    <tr>
      <td class="id">${l.line_id}</td>
      <td class="num amount"><input data-id="${l.line_id}" class="num" value="${l.amount}" inputmode="decimal"></td>
      <td class="num share" id="share-${l.line_id}">—</td>
    </tr>`).join("");
  for (const input of $("lines").querySelectorAll("input")) {
    input.addEventListener("change", e => {
      const line = lines.find(l => l.line_id === e.target.dataset.id);
      line.amount = e.target.value.trim();
      calculate();
    });
  }
  $("order").textContent = "allocation order: " + lines.map(l => l.line_id).join(" → ");
}

async function calculate() {
  $("err").textContent = "";
  let data;
  try {
    const res = await fetch("/api/allocate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ total: $("total").value.trim(), lines }),
    });
    data = await res.json();
    if (!res.ok) throw new Error(data.error || "request failed");
  } catch (e) {
    $("err").textContent = e.message;
    return;
  }

  for (const share of data.shares) {
    const cell = $("share-" + share.line_id);
    if (!cell) continue;
    const changed = previous[share.line_id] !== undefined && previous[share.line_id] !== share.display;
    cell.textContent = share.display;
    cell.classList.remove("changed");
    if (changed) { void cell.offsetWidth; cell.classList.add("changed"); }
    previous[share.line_id] = share.display;
  }

  const badge = $("badge");
  badge.className = "badge " + (data.reconciled ? "good" : "bad");
  badge.querySelector(".headline").textContent =
    data.allocated_display + " of " + data.total_display;
  badge.querySelector(".detail").textContent = data.reconciled
    ? "Reconciled — the parts add up to the refund."
    : "Does not reconcile — off by " + data.difference_display + ".";
}

$("recalc").addEventListener("click", calculate);
$("total").addEventListener("change", calculate);
$("reset").addEventListener("click", () => {
  lines = DEFAULT_LINES.map(l => ({ ...l }));
  $("total").value = "100.00";
  previous = {};
  renderLines();
  calculate();
});
$("shuffle").addEventListener("click", () => {
  for (let i = lines.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [lines[i], lines[j]] = [lines[j], lines[i]];
  }
  renderLines();
  calculate();
});

renderLines();
calculate();
</script>
</body>
</html>
